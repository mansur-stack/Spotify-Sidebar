<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spotify Sidebar</title>
<link rel="stylesheet" href="c.css">
</head>
<body>

<div class="stage">

  <!-- COLLAPSED RAIL -->
  <div class="window rail">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 10c5-2 9-2 14 0M5.5 13.2c4-1.6 8-1.6 13 0M6.2 16.2c3.2-1.1 6.4-1.1 9.6 0" stroke="#04140d" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <nav>
      <div class="icon active">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9h12v-9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="16" rx="2" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke-width="1.8"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a5 5 0 0 0-5 5v3.5c0 .9-.4 1.7-1 2.4L4.5 16h15L18 13.9c-.6-.7-1-1.5-1-2.4V8a5 5 0 0 0-5-5Z" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="dot-badge"></span>
      </div>
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke-width="1.8"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
    </nav>
    <div class="spacer"></div>
    <div class="bottom">
      <div class="play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="device">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="9" width="16" height="10" rx="2"/><path d="M9 5h6M12 5v4"/></svg>
      </div>
      <div class="avatar"></div>
    </div>
  </div>

  <!-- EXPANDED PANEL -->
  <div class="window panel">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 10c5-2 9-2 14 0M5.5 13.2c4-1.6 8-1.6 13 0M6.2 16.2c3.2-1.1 6.4-1.1 9.6 0" stroke="#04140d" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-name">Spotify</div>
    </div>

    <hr>

    <div class="menu-label">MENU</div>

    <div class="menu-item active">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9h12v-9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">Home</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="menu-item">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="label">Search</span>
    </div>
    <div class="menu-item">
      <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="16" rx="2" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="label">Your library</span>
    </div>
    <div class="menu-item">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke-width="1.8"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <span class="label">Premium</span>
    </div>
    <div class="menu-item">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a5 5 0 0 0-5 5v3.5c0 .9-.4 1.7-1 2.4L4.5 16h15L18 13.9c-.6-.7-1-1.5-1-2.4V8a5 5 0 0 0-5-5Z" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="label">Notification</span>
      <span class="badge"></span>
    </div>
    <div class="menu-item">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke-width="1.8"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <span class="label">Settings</span>
    </div>

    <div class="now-playing">
      <div class="beat-sign">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
      <div class="track-title">Eminem &nbsp;·&nbsp; Without Me</div>
      <div class="seek">
        <div class="fill"></div>
        <div class="knob"></div>
      </div>
      <div class="transport">
        <svg viewBox="0 0 24 24"><path d="M11 6 3 12l8 6V6ZM21 6l-8 6 8 6V6Z"/></svg>
        <div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <svg viewBox="0 0 24 24"><path d="M13 6l8 6-8 6V6ZM3 6l8 6-8 6V6Z"/></svg>
      </div>
    </div>

    <div class="user-row">
      <div class="avatar"></div>
      <div class="who">
        <div class="name">Nazia Jenny</div>
        <div class="sub">Premium Account</div>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
    </div>
  </div>

</div>

</body>
</html>
